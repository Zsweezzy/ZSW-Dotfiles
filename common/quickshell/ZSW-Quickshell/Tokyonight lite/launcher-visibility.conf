# Which apps Hyprland's launcher (Super+R) shows.
#
# plasma-shared  <desktop id>  A KDE app this session launches too. Every other
#                              app carrying the KDE category stays Plasma-only.
# hypr-hidden    <desktop id>  An app hidden from this launcher, whatever its
#                              category.
#
# Matching is a prefix, so "org.kde.ark" also matches "org.kde.ark.desktop".
# Changes apply on the next launcher open; no restart needed.

plasma-shared  org.kde.ark
plasma-shared  org.kde.kwalletmanager

# Artcraft suite (17 apps) + its AppImage launcher. Prefixes cover the lot.
hypr-hidden  ai.storyteller.
hypr-hidden  artcraft
