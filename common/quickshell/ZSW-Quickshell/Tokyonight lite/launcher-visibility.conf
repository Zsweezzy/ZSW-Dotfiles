# Which apps Hyprland's launcher (Super+R) shows.
#
# plasma-shared         <desktop id>  A KDE app this session launches too. Every
#                                     other app carrying the KDE category stays
#                                     Plasma-only.
# hypr-hidden           <desktop id>  Hidden from this launcher, whatever its
#                                     category.
# hypr-hidden-category  <Category>    Hides every app carrying that .desktop
#                                     category, including ones installed later.
# hypr-shown            <desktop id>  Wins over the two hide rules above.
#
# Ids match as a prefix, so "org.kde.ark" also matches "org.kde.ark.desktop".
# Changes apply on the next launcher open; no restart needed.

plasma-shared  org.kde.ark
plasma-shared  org.kde.kwalletmanager

# Artcraft suite (17 apps) + its AppImage launcher. Prefixes cover the lot.
hypr-hidden  ai.storyteller.
hypr-hidden  artcraft

# Everything gaming, by category: 72 entries, and any game added later.
hypr-hidden-category  Game
hypr-hidden-category  Emulator

# Gaming tools that are only categorised Utility.
hypr-hidden  protontricks
hypr-hidden  winetricks

# Steam and the Epic launchers stay reachable, even though they are Game-tagged.
hypr-shown  steam
hypr-shown  epic-games-launcher
hypr-shown  epicgameslauncher

# SolidCraft and MangoJuice ship as Graphics/Utility, so no category catches them.
hypr-hidden  io.tangencylabs.
hypr-hidden  io.github.radiolamp.mangojuice

# System resource monitors: btop, Mission Center, lstopo.
hypr-hidden-category  Monitor

# Qt toolchain GUIs: help viewer, widget designer, translator, D-Bus, CMake,
# and the two V4L2 test tools.
hypr-hidden  assistant
hypr-hidden  designer
hypr-hidden  linguist
hypr-hidden  qdbusviewer
hypr-hidden  cmake-gui
hypr-hidden  qv4l2
hypr-hidden  qvidcap
hypr-hidden  qt6ct

# Standalone settings/utility GUIs.
hypr-hidden  io.github.ilya_zlobintsev.LACT
hypr-hidden  kvantummanager
hypr-hidden  nwg-look
hypr-hidden  gtk-lshw
hypr-hidden  org.cachyos.scx-manager
hypr-hidden  uuctl

# gpsd test clients. "xgps" also covers xgpsspeed.
hypr-hidden  xgps
