# (MangoHud only reads this file, not the MangoHud.conf that sits in the game
# folder -- per-game configs belong in ~/.config/MangoHud/<name>.conf.)
# autostart_log=0 so nothing logs automatically; Shift_L+F2 starts a capture on
# demand, log_duration sets its length, output_folder where it lands.
