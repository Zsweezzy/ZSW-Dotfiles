# vim:ft=kitty
## name: Tokyo Night Moon
## author: maxii
## blurb: Tokyo Night Moon palette for kitty. Matches the nvim tokyonight (moon) colorscheme.

# Basic colors
foreground           #c8d3f5
background           #222436
selection_foreground #c8d3f5
selection_background #2f334d

# Cursor colors
cursor            #c8d3f5
cursor_text_color #222436

# URL underline color when hovering with mouse
url_color #82aaff

# Window border colors and terminal bell colors
active_border_color   #82aaff
inactive_border_color #2f334d
bell_border_color     #ff757f
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #1e2030
active_tab_background   #82aaff
inactive_tab_foreground #c8d3f5
inactive_tab_background #1e2030
tab_bar_background      #1e2030
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #1e2030
mark1_background #c099ff
mark2_foreground #1e2030
mark2_background #ff757f
mark3_foreground #1e2030
mark3_background #ffc777

# The basic 16 colors (Tokyo Night Moon)
