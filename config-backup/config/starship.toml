"$schema" = "https://starship.rs/config-schema.json"

# Port of ~/.config/oh-my-posh/tokyonight-moon.omp.json
# Segments: session / path / git / node / time (left), aws (right)
#
# Minor differences vs OMP:
#  - git stash count / ahead-behind symbols sit outside the branch parens
#  - at $HOME the directory shows "~" instead of the home folder name
#  - node shows the  (engine) icon instead of the package-manager icon

format = """
[](fg:#c8d3f5)\
$username\
[](fg:#c8d3f5 bg:#82aaff)\
$directory\
[](fg:#82aaff bg:#c099ff)\
$git_branch\
$git_status\
[](fg:#c099ff bg:#444a73)\
$nodejs\
[](fg:#444a73 bg:#ff757f)\
$time\
[ ](fg:#ff757f)\
"""

right_format = '$aws'

[aws]
format = '[](fg:#c8d3f5)[ $symbol$profile(@$region) ]($style)[](fg:#c8d3f5)'
symbol = ''
style = 'bg:#c8d3f5 fg:#1b1d2b'

[username]
show_always = true
format = '[$user ]($style)'
style_user = 'bg:#c8d3f5 fg:#1b1d2b'
style_root = 'bg:#c8d3f5 fg:#1b1d2b'

[directory]
format = '[ $path ]($style)'
style = 'bg:#82aaff fg:#1b1d2b'
truncation_length = 1
truncation_symbol = ''
truncate_to_repo = false

[git_branch]
symbol = ''
format = '[  ($branch) ]($style)'
style = 'bg:#c099ff fg:#1b1d2b'

[git_status]
style = 'bg:#c099ff fg:#1b1d2b'
format = '[( $stashed$ahead_behind)]($style)'
stashed = '$count'
ahead = '⇡'
behind = '⇣'
diverged = '⇕'
up_to_date = ''
conflicted = ''
untracked = ''
modified = ''
staged = ''
renamed = ''
deleted = ''
typechanged = ''
worktree_added = ''
worktree_deleted = ''
worktree_modified = ''
worktree_typechanged = ''
index_added = ''
index_deleted = ''
index_modified = ''
index_typechanged = ''

[nodejs]
symbol = ''
format = '[ $symbol 7.2.10-1-cachyos ]($style)'
style = 'bg:#444a73 fg:#c8d3f5'

[time]
disabled = false
format = '[ ♥ $time ]($style)'
time_format = '%R'
style = 'bg:#ff757f fg:#1b1d2b'