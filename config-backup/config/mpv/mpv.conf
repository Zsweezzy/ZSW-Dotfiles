# MPV configuration file
# Use the custom YouTube-style OSC (youtube-ui.lua) instead of the default one
osc=no

# Start maximized (fills the screen but keeps the taskbar/tabbar visible;
# true fullscreen would let Plasma hide its panels)
window-maximized=yes

# GPU rendering needs the Nix drivers (mesa), installed via `nix profile install
# nixpkgs#mesa`; without them mpv silently falls back to the software wlshm vo,
# which renders no overlays at all (thumbnails vanish). Do not pin
# gpu-context=wayland here: that selects the OpenGL/EGL path, which fails on this
# nix-on-Arch setup; the default auto context selects Vulkan (waylandvk) and works.
