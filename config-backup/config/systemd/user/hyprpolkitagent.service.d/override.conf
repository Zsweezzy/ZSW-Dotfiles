# hyprpolkitagent connects to the Wayland compositor at exec time, so any start
# that lands before Hyprland's socket answers (Hyprland restart, or the D-Bus
# activation in org.hyprland.hyprpolkitagent.service) exits status=1. With the
# default Restart=on-failure it burns 6 rapid restarts and then stays dead with
# start-limit-hit, leaving the session with no polkit agent -- pkexec/Shelly
# cannot show a password prompt and installs silently do nothing. Retry slowly
# instead, so it comes up once the compositor does.
#
# StartLimitIntervalSec=0 (no limit at all) traded that bug for a worse one: on
# a *permanent* failure the unit looped forever, 2s apart. A concurrent desktop
# session that already owns the polkit registration makes registration fail
# every time, so on 2026-10-20 that loop ran 2882 restarts and wrote 111 cores.
# Keep a generous but finite budget instead: 60 attempts across 5 minutes, which
# is far past any compositor startup, but still stops rather than spinning.
#
# LimitCORE=0: when it does fail it crashes in a libsdbus-c++ static destructor
# (sdbus::Variant::Variant -> createPlainMessage) on the way out of exit(),
# which is an upstream teardown-ordering bug we cannot patch. Those cores are
# useless, and decompressing them is exactly the kind of allocation spike that
# fed the 12:43 OOM -- so take them away.
[Unit]
StartLimitIntervalSec=300

[Service]
Restart=always
RestartSec=2
StartLimitBurst=60
LimitCORE=0
