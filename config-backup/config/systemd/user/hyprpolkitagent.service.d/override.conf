# hyprpolkitagent connects to the Wayland compositor at exec time, so any start
# that lands before Hyprland's socket answers (Hyprland restart, or the D-Bus
# activation in org.hyprland.hyprpolkitagent.service) exits status=1. With the
# default Restart=on-failure it burns 6 rapid restarts and then stays dead with
# start-limit-hit, leaving the session with no polkit agent -- pkexec/Shelly
# cannot show a password prompt and installs silently do nothing. Retry slowly
# and without a rate limit instead, so it comes up once the compositor does.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
