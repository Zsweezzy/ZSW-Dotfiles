# Give Nix-built GUI apps access to a GPU on CachyOS.
#
# Nix glvnd/vulkan-loader only search /run/opengl-driver (a NixOS path that
# never exists here), so they found nothing and Nix apps fell back to software
# rendering. Point that tree at the Nix mesa *in the user profile*.
#
# Why the profile path and not /usr: the system mesa's vendor JSONs reference
# libraries by bare name ("libEGL_mesa.so.0") and its .so files need system-only
# deps (libLLVM, libxkbcommon) that a Nix process cannot resolve. Nix mesa's own
# JSONs carry absolute /nix/store paths and its closure is self-contained, so it
# loads cleanly with no LD_LIBRARY_PATH.
#
# mesa must stay in the profile (packages.nix declares it) or the store path
# these JSONs point at can be garbage-collected.
# Installed by src/gpu/install.sh (root); persisted by tmpfiles.d across reboots.
L+ /run/opengl-driver/share/glvnd - - - - /home/maxii/.nix-profile/share/glvnd
# Whole share/vulkan, not just icd.d: the layer dirs must come from the profile
# too, otherwise the loader picks the system's layer JSONs (bare library names)
# and logs "cannot open libVkLayer_MESA_*.so" for each.
L+ /run/opengl-driver/share/vulkan - - - - /home/maxii/.nix-profile/share/vulkan
L+ /run/opengl-driver/lib/dri     - - - - /home/maxii/.nix-profile/lib/dri
L+ /run/opengl-driver/lib/gbm     - - - - /home/maxii/.nix-profile/lib/gbm
