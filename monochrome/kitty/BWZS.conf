# vim:ft=kitty
## name: BWZS
## author: maxii
## blurb: Black and white (BWZS) monochrome theme with red accents for strings/errors.

# Basic colors
foreground           #ffffff
background           #0a0a0a
selection_foreground #000000
selection_background #e6e6e6

# Cursor colors
cursor            #ffffff
cursor_text_color #0a0a0a

# URL underline color when hovering with mouse
url_color #b3b3b3

# Window border colors and terminal bell colors
active_border_color   #cccccc
inactive_border_color #333333
bell_border_color     #ffffff
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #444444
inactive_tab_foreground #999999
inactive_tab_background #1a1a1a
tab_bar_background      #0a0a0a
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #000000
mark1_background #ffffff
mark2_foreground #000000
mark2_background #808080
mark3_foreground #000000
mark3_background #b3b3b3

# The basic 16 colors (grayscale, except red for strings/errors)
# black
color0 #0a0a0a
color8 #555555

# red (strings, errors)
color1  #ff0000
color9  #ff8787

# green
color2  #7d7d7d
color10 #8c8c8c

# yellow
color3  #949494
color11 #a3a3a3

# blue
color4  #a8a8a8
color12 #b8b8b8

# magenta
color5  #c0c0c0
color13 #d0d0d0

# cyan
color6  #d4d4d4
color14 #e0e0e0

# white
color7  #e6e6e6
color15 #ffffff